version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: obras_postgres
    environment:
      POSTGRES_DB: obras_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d obras_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  restservice:
    build: .
    image: restservice:latest
    container_name: restservice
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/obras_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    restart: unless-stopped

volumes:
  postgres_data:
