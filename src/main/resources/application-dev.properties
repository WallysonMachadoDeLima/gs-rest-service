# application-dev.properties - Para desenvolvimento local com H2
# Para usar: java -jar app.jar --spring.profiles.active=dev

# Configurações do Banco de Dados H2 (desenvolvimento)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2 habilitado
spring.h2.console.enabled=true

# Flyway desabilitado para desenvolvimento
spring.flyway.enabled=false

# Configurações do Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.org.springframework=DEBUG
logging.level.com.example.restservice=DEBUG